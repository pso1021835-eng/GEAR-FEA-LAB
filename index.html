<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기어 강도 시뮬레이터</title>
  <style>
    :root { --border:#2d3440; --panel:#141922; --bg:#090c12; --text:#e7edf5; --muted:#9aa6b5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Malgun Gothic",sans-serif; }
    header { height:56px; display:flex; align-items:center; padding:0 16px; border-bottom:1px solid var(--border); font-weight:700; }
    main { display:grid; grid-template-columns:280px minmax(320px,1fr) 280px; min-height:calc(100vh - 56px); }
    aside, section { border-right:1px solid var(--border); background:var(--panel); }
    aside:last-child { border-right:0; }
    section { position:relative; background:#0d1118; }
    .panel { padding:16px; }
    h2 { margin:0 0 12px; font-size:14px; }
    .placeholder { color:var(--muted); font-size:13px; }
    #view { position:absolute; inset:0; cursor:grab; touch-action:none; }
    fieldset { border:1px solid var(--border); border-radius:6px; margin:0 0 12px; padding:8px 10px; }
    legend { color:var(--muted); font-size:12px; padding:0 4px; }
    .row { display:grid; grid-template-columns:1fr 78px 34px; gap:6px; align-items:center; font-size:12.5px; margin:4px 0; }
    .row input { width:100%; background:#0b0f15; color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px 5px; font:inherit; }
    .row em { color:var(--muted); font-style:normal; font-size:11px; }
    table { width:100%; border-collapse:collapse; font-size:12.5px; }
    th { text-align:left; font-weight:400; color:var(--muted); padding:3px 0; }
    td { text-align:right; padding:3px 0 3px 6px; font-variant-numeric:tabular-nums; }
    td:last-child { color:var(--muted); width:28px; }
    .warn { color:#f0b44c; font-size:12px; padding-left:16px; } .ok { color:#7ccf8a; font-size:12px; }
    .err { color:#ff6b6b; font-size:12.5px; } .note { color:var(--muted); font-size:11.5px; line-height:1.5; }
    aside.panel { overflow-y:auto; max-height:calc(100vh - 56px); }
    @media (max-width:900px) { main { grid-template-columns:220px minmax(260px,1fr) 220px; } }
  </style>
</head>
<body>
  <header>기어 강도 시뮬레이터</header>
  <main>
    <aside class="panel">
      <h2>입력</h2>
      <div id="inputs"></div>
    </aside>
    <section aria-label="3D 화면">
      <div id="view"></div>
    </section>
    <aside class="panel">
      <h2>형상 정보</h2>
      <div id="result"></div>
      <h2>선형 탄성 해석</h2>
      <label class="row"><span>맞물림 기어 잇수</span><input id="mate-teeth" type="number" min="3" step="1" value="40"><em>개</em></label>
      <label class="row"><span>토크</span><input id="torque" type="number" min="0.01" step="0.1" value="40"><em>N·m</em></label>
      <button id="run-fea" type="button">해석 실행</button>
      <p id="fea-result" role="status" class="note"></p>
    </aside>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/gear.js?v=f1-1"></script>
  <script src="src/app.js?v=f2-1"></script>
</body>
</html>
